<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>融合版 · 模板库</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');
:root{--bg:#f0f2f5;--white:#fff;--glass:rgba(255,255,255,.78);--glass-b:rgba(255,255,255,.92);--blue1:#4A9EF7;--blue2:#6CB8FF;--grad:linear-gradient(135deg,#4A9EF7,#6CB8FF);--text1:#1B1F2A;--text2:#6B7280;--text3:#9CA3AF;--border:#E5E7EB;--border-l:#F0F1F3;--hover:#F3F4F6;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-full:999px;--sh-sm:0 1px 2px rgba(0,0,0,.04);--sh-md:0 2px 8px rgba(0,0,0,.06);--sh-lg:0 8px 24px rgba(0,0,0,.08);--sh-float:0 4px 16px rgba(74,158,247,.18);--sh-glass:0 8px 32px rgba(0,0,0,.06);--ease:cubic-bezier(.25,.1,.25,1);--ease-out:cubic-bezier(.16,1,.3,1);--ok:#22C55E;--warn:#F59E0B;--danger:#EF4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Inter","Noto Sans SC",-apple-system,sans-serif;background:var(--bg);color:var(--text1);font-size:13px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
svg{display:block}
.toolbar{position:fixed;top:0;left:0;right:0;height:48px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border-l);display:flex;align-items:center;padding:0 12px;gap:6px;z-index:100}
.toolbar__brand{display:flex;align-items:center;gap:8px;flex:none}
.toolbar__logo{width:24px;height:24px;background:var(--grad);border-radius:6px;display:flex;align-items:center;justify-content:center}
.toolbar__sep{width:1px;height:20px;background:var(--border);margin:0 4px;flex:none}
.toolbar__btn{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:var(--r-md);font-size:12px;font-weight:500;color:var(--text2);transition:all .18s}
.toolbar__btn:hover{background:rgba(0,0,0,.04);color:var(--text1)}
.toolbar__btn svg{width:15px;height:15px}
.toolbar__btn--primary{background:var(--grad);color:#fff;padding:7px 16px;box-shadow:var(--sh-float);border-radius:var(--r-md)}
.toolbar__btn--primary:hover{transform:scale(1.02);box-shadow:0 4px 20px rgba(74,158,247,.3);background:var(--grad)}
.toolbar__filename{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 16px;border-radius:var(--r-md);cursor:pointer}
.toolbar__filename:hover{background:rgba(0,0,0,.04)}
.toolbar__filename-name{font-size:13px;font-weight:500}
.toolbar__right{display:flex;align-items:center;gap:4px;flex:none}

.app{display:flex;height:100vh;padding-top:48px}
.side{width:264px;background:var(--white);border-right:1px solid var(--border-l);display:flex;flex-direction:column;flex:none}
.side__tabs{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--border-l)}
.side__tab{padding:8px 14px;font-size:12px;font-weight:500;color:var(--text3);border-radius:var(--r-sm) var(--r-sm) 0 0;cursor:pointer;transition:all .18s;position:relative}
.side__tab.active{color:var(--blue1);background:rgba(74,158,247,.06)}
.side__tab.active::after{content:"";position:absolute;bottom:-1px;left:12px;right:12px;height:2px;background:var(--grad);border-radius:var(--r-full)}
.side__body{flex:1;overflow-y:auto;padding:12px}
.side__nav{display:flex;flex-direction:column;gap:2px}
.side__nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-md);color:var(--text2);font-size:13px;font-weight:500;transition:all .18s;text-decoration:none}
.side__nav-item:hover{background:var(--hover);color:var(--text1)}
.side__nav-item.active{background:rgba(74,158,247,.1);color:var(--blue1)}
.side__nav-item svg{width:18px;height:18px;opacity:.7}
.side__nav-item.active svg{opacity:1}

.main{flex:1;overflow-y:auto;padding:28px 36px}
.main__head{margin-bottom:20px}
.main__title{font-size:28px;font-weight:700;letter-spacing:-.02em}
.main__sub{font-size:13px;color:var(--text2);margin-top:4px}

.search-bar{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--border);border-radius:var(--r-full);padding:8px 16px;margin-bottom:16px;max-width:400px}
.search-bar svg{width:15px;height:15px;color:var(--text3);flex:none}
.search-bar span{font-size:13px;color:var(--text3)}

.cats{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.cat{padding:7px 16px;border-radius:var(--r-full);font-size:12px;font-weight:500;color:var(--text2);background:var(--white);border:1px solid var(--border);transition:all .2s;cursor:pointer}
.cat:hover{border-color:var(--blue1);color:var(--blue1)}
.cat.active{background:var(--text1);color:#fff;border-color:var(--text1)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--white);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);transition:all .3s var(--ease);cursor:pointer;position:relative}
.card:hover{transform:translateY(-5px);box-shadow:var(--sh-lg);border-color:transparent}
.card__thumb{height:220px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card__thumb--a{background:linear-gradient(135deg,#EEF2FF,#E0E7FF)}
.card__thumb--b{background:linear-gradient(135deg,#F0FDF4,#DCFCE7)}
.card__thumb--c{background:linear-gradient(135deg,#FFF7ED,#FFEDD5)}
.card__thumb--d{background:linear-gradient(135deg,#FDF2F8,#FCE7F3)}
.card__thumb--e{background:linear-gradient(135deg,#ECFEFF,#CFFAFE)}
.card__thumb--f{background:linear-gradient(135deg,#F5F3FF,#EDE9FE)}
.card__mini{width:130px;height:170px;background:#fff;border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.1);padding:12px;overflow:hidden;display:flex;flex-direction:column;gap:5px}
.card__mini-line{height:5px;background:#E5E7EB;border-radius:3px}
.card__mini-line.w80{width:80%}.card__mini-line.w60{width:60%}.card__mini-line.w40{width:40%}
.card__mini-bar{height:3px;background:var(--blue1);opacity:.3;border-radius:2px}
.card__mini-bar.w70{width:70%}.card__mini-bar.w50{width:50%}
.card__star{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .2s;border:1px solid var(--glass-b)}
.card__star:hover{color:#F59E0B;border-color:#F59E0B}
.card__star.on{color:#F59E0B}
.card__body{padding:16px}
.card__name{font-size:14px;font-weight:600;margin-bottom:3px}
.card__desc{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:10px}
.card__tags{display:flex;gap:6px;flex-wrap:wrap}
.card__tag{font-size:10px;padding:3px 8px;border-radius:var(--r-full);background:var(--hover);color:var(--text2)}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.main__head{animation:fadeUp .5s var(--ease-out) both}
.search-bar{animation:fadeUp .5s var(--ease-out) .05s both}
.cats{animation:fadeUp .5s var(--ease-out) .1s both}
.card:nth-child(1){animation:fadeUp .4s var(--ease-out) .15s both}
.card:nth-child(2){animation:fadeUp .4s var(--ease-out) .2s both}
.card:nth-child(3){animation:fadeUp .4s var(--ease-out) .25s both}
.card:nth-child(4){animation:fadeUp .4s var(--ease-out) .3s both}
.card:nth-child(5){animation:fadeUp .4s var(--ease-out) .35s both}
.card:nth-child(6){animation:fadeUp .4s var(--ease-out) .4s both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="toolbar">
  <div class="toolbar__brand"><div class="toolbar__logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M7 3h7l4 4v14H7z"/></svg></div></div>
  <div class="toolbar__sep"></div>
  <button class="toolbar__btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a5.5 5.5 0 010 11h-3"/></svg>撤销</button>
  <button class="toolbar__btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a5.5 5.5 0 000 11h3"/></svg>重做</button>
  <div class="toolbar__filename"><span class="toolbar__filename-name">张明-后端开发工程师-2026届</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6"/></svg></div>
  <div class="toolbar__right">
    <button class="toolbar__btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.5"/></svg>预览</button>
    <button class="toolbar__btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4l1.8 5.2L19 11l-5.2 1.8L12 18l-1.8-5.2L5 11l5.2-1.8z"/></svg>AI 建议</button>
    <button class="toolbar__btn toolbar__btn--primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M4 15v4.5A1.5 1.5 0 005.5 21h13a1.5 1.5 0 001.5-1.5V15"/></svg>导出 PDF</button>
    <button class="toolbar__btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5.5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18.5" cy="12" r="1"/></svg></button>
  </div>
</div>
<div class="app">
  <aside class="side">
    <div class="side__tabs"><div class="side__tab active">模板</div><div class="side__tab">组件</div><div class="side__tab">素材</div><div class="side__tab">页面</div></div>
    <div class="side__body">
      <nav class="side__nav">
        <a class="side__nav-item active" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>模板库</a>
        <a class="side__nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 10h17M9.5 10v9.5"/></svg>组件</a>
        <a class="side__nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>导出检查</a>
        <a class="side__nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg>图层</a>
      </nav>
    </div>
  </aside>
  <div class="main">
    <div class="main__head">
      <div class="main__title">模板库</div>
      <div class="main__sub">探索真实工作案例，找到模板，一键开始。</div>
    </div>
    <div class="search-bar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><span>搜索模板</span></div>
    <div class="cats">
      <button class="cat active">全部</button><button class="cat">技术简历</button><button class="cat">产品运营</button><button class="cat">设计创意</button><button class="cat">学术科研</button><button class="cat">通用商务</button>
    </div>
    <div class="grid">
      <div class="card">
        <div class="card__thumb card__thumb--a">
          <div class="card__mini"><div class="card__mini-line w80"></div><div class="card__mini-line w60"></div><div style="height:6px"></div><div class="card__mini-bar"></div><div class="card__mini-bar w70"></div><div class="card__mini-bar w50"></div><div style="height:6px"></div><div class="card__mini-bar"></div><div class="card__mini-bar w70"></div></div>
          <button class="card__star"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5L12 16l-6.5 5 2-7.5L2 9h7z"/></svg></button>
        </div>
        <div class="card__body"><div class="card__name">技术简洁</div><div class="card__desc">单栏排版，适合后端/前端/算法等技术岗位，ATS 友好。</div><div class="card__tags"><span class="card__tag">技术</span><span class="card__tag">单栏</span><span class="card__tag">1-2 页</span></div></div>
      </div>
      <div class="card">
        <div class="card__thumb card__thumb--b">
          <div class="card__mini"><div class="card__mini-line w80"></div><div class="card__mini-line w40"></div><div style="height:6px"></div><div class="card__mini-bar"></div><div class="card__mini-bar w50"></div><div style="height:6px"></div><div class="card__mini-bar w70"></div><div class="card__mini-bar"></div></div>
          <button class="card__star"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5L12 16l-6.5 5 2-7.5L2 9h7z"/></svg></button>
        </div>
        <div class="card__body"><div class="card__name">产品精英</div><div class="card__desc">突出项目成果与数据，适合产品经理、运营等岗位。</div><div class="card__tags"><span class="card__tag">产品</span><span class="card__tag">双栏</span><span class="card__tag">数据导向</span></div></div>
      </div>
      <div class="card">
        <div class="card__thumb card__thumb--c">
          <div class="card__mini"><div class="card__mini-line w60"></div><div class="card__mini-line w80"></div><div style="height:6px"></div><div class="card__mini-bar w70"></div><div class="card__mini-bar"></div><div class="card__mini-bar w50"></div></div>
          <button class="card__star on"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5L12 16l-6.5 5 2-7.5L2 9h7z"/></svg></button>
        </div>
        <div class="card__body"><div class="card__name">学术科研</div><div class="card__desc">突出论文、项目、技能矩阵，适合读研/留学申请。</div><div class="card__tags"><span class="card__tag">学术</span><span class="card__tag">含照片位</span><span class="card__tag">2 页</span></div></div>
      </div>
      <div class="card">
        <div class="card__thumb card__thumb--d">
          <div class="card__mini"><div class="card__mini-line w80"></div><div class="card__mini-line w60"></div><div class="card__mini-line w40"></div><div style="height:6px"></div><div class="card__mini-bar"></div><div class="card__mini-bar w70"></div></div>
          <button class="card__star"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5L12 16l-6.5 5 2-7.5L2 9h7z"/></svg></button>
        </div>
        <div class="card__body"><div class="card__name">设计作品集</div><div class="card__desc">大幅面作品展示区，适合设计师、创意岗位。</div><div class="card__tags"><span class="card__tag">设计</span><span class="card__tag">作品集</span><span class="card__tag">彩色</span></div></div>
      </div>
      <div class="card">
        <div class="card__thumb card__thumb--e">
          <div class="card__mini"><div class="card__mini-line w80"></div><div class="card__mini-line w60"></div><div style="height:6px"></div><div class="card__mini-bar w50"></div><div class="card__mini-bar"></div><div class="card__mini-bar w70"></div></div>
          <button class="card__star"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5L12 16l-6.5 5 2-7.5L2 9h7z"/></svg></button>
        </div>
        <div class="card__body"><div class="card__name">通用商务</div><div class="card__desc">简洁大方的商务风格，适合大多数岗位投递。</div><div class="card__tags"><span class="card__tag">通用</span><span class="card__tag">单栏</span><span class="card__tag">经典</span></div></div>
      </div>
      <div class="card">
        <div class="card__thumb card__thumb--f">
          <div class="card__mini"><div class="card__mini-line w60"></div><div class="card__mini-line w80"></div><div class="card__mini-line w40"></div><div style="height:6px"></div><div class="card__mini-bar"></div><div class="card__mini-bar w50"></div></div>
          <button class="card__star"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5L12 16l-6.5 5 2-7.5L2 9h7z"/></svg></button>
        </div>
        <div class="card__body"><div class="card__name">极简留白</div><div class="card__desc">大量留白，文字为王，适合内容不多但要求精致。</div><div class="card__tags"><span class="card__tag">极简</span><span class="card__tag">单栏</span><span class="card__tag">1 页</span></div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
