<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>05 空状态 · ResumeCraft</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
:root{--bg:#f5f6f8;--white:#fff;--glass:rgba(255,255,255,.72);--blue1:#4A9EF7;--blue2:#6CB8FF;--grad:linear-gradient(135deg,#4A9EF7,#6CB8FF);--text1:#1B1F2A;--text2:#6B7280;--text3:#9CA3AF;--border:#E5E7EB;--hover:#F3F4F6;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-full:999px;--sh-md:0 2px 8px rgba(0,0,0,.06);--sh-lg:0 8px 24px rgba(0,0,0,.08);--sh-float:0 4px 16px rgba(74,158,247,.15);--ease:cubic-bezier(.25,.1,.25,1);--ease-out:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Inter","Noto Sans SC",-apple-system,sans-serif;background:var(--bg);color:var(--text1);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
svg{display:block}
.topbar{position:fixed;top:0;left:0;right:0;height:36px;background:var(--white);border-bottom:1px solid #F0F1F3;display:flex;align-items:center;padding:0 12px;z-index:100;user-select:none}
.topbar__logo{width:20px;height:20px;background:var(--grad);border-radius:5px;display:flex;align-items:center;justify-content:center;margin-right:8px;flex:none}
.topbar__sp{flex:1}
.topbar__cb{width:28px;height:28px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--text3)}
.topbar__cb:hover{background:var(--hover)}
.topbar__cb--x:hover{background:#EF4444;color:#fff}
.app{display:flex;height:100vh;padding-top:36px}
.sidebar{width:220px;background:var(--white);border-right:1px solid #F0F1F3;display:flex;flex-direction:column;padding:12px;flex:none}
.sidebar__nav{display:flex;flex-direction:column;gap:2px}
.sidebar__item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-md);color:var(--text2);font-size:13px;font-weight:500;transition:all .2s;text-decoration:none}
.sidebar__item:hover{background:var(--hover);color:var(--text1)}
.sidebar__item.active{background:rgba(74,158,247,.1);color:var(--blue1)}
.sidebar__item svg{width:18px;height:18px;flex:none;opacity:.7}
.sidebar__item.active svg{opacity:1}
.sidebar__ft{margin-top:auto;padding:12px;border-top:1px solid #F0F1F3}
.sidebar__user{display:flex;align-items:center;gap:8px}
.sidebar__avatar{width:32px;height:32px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;flex:none}
.sidebar__uname{font-size:12px;font-weight:500}
.sidebar__badge{font-size:10px;color:var(--text3)}
.sidebar__badge em{font-style:normal;background:rgba(74,158,247,.1);color:var(--blue1);padding:1px 6px;border-radius:var(--r-full);font-weight:500}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;overflow-y:auto}
.empty__title{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px;text-align:center;animation:fadeUp .5s var(--ease-out) both}
.empty__sub{font-size:14px;color:var(--text2);margin-bottom:40px;text-align:center;animation:fadeUp .5s var(--ease-out) .05s both}
.entries{display:flex;gap:16px;margin-bottom:48px;animation:fadeUp .5s var(--ease-out) .1s both}
.entry{width:200px;padding:28px 24px;background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);text-align:center;cursor:pointer;transition:all .3s var(--ease)}
.entry:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:transparent}
.entry__icon{width:48px;height:48px;border-radius:var(--r-md);margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.entry__icon--a{background:rgba(74,158,247,.1);color:var(--blue1)}
.entry__icon--b{background:rgba(34,197,94,.1);color:#22C55E}
.entry__icon--c{background:rgba(245,158,11,.1);color:#F59E0B}
.entry__icon svg{width:24px;height:24px}
.entry__name{font-size:15px;font-weight:600;margin-bottom:4px}
.entry__desc{font-size:12px;color:var(--text2);line-height:1.5}
.entry--primary{border-color:rgba(74,158,247,.3);background:linear-gradient(135deg,rgba(74,158,247,.04),rgba(108,184,255,.02))}
.entry--primary:hover{border-color:var(--blue1)}
.recent{width:100%;max-width:640px;animation:fadeUp .5s var(--ease-out) .15s both}
.recent__title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px}
.recent__list{display:flex;flex-direction:column;gap:6px}
.recent__item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--white);border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;transition:all .2s}
.recent__item:hover{border-color:var(--blue1);box-shadow:var(--sh-md)}
.recent__icon{width:36px;height:36px;border-radius:var(--r-sm);background:rgba(74,158,247,.1);display:flex;align-items:center;justify-content:center;color:var(--blue1);flex:none}
.recent__name{font-size:13px;font-weight:500}
.recent__meta{font-size:11px;color:var(--text3)}
.recent__arrow{margin-left:auto;color:var(--text3)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar__logo"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M7 3h7l4 4v14H7z"/></svg></div>
  <div class="topbar__sp"></div>
  <button class="topbar__cb"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
  <button class="topbar__cb topbar__cb--x"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div class="app">
  <aside class="sidebar">
    <nav class="sidebar__nav">
      <a class="sidebar__item active" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>新建简历</a>
      <a class="sidebar__item" href="trae-02-templates.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>模板库</a>
      <a class="sidebar__item" href="trae-03-import.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/></svg>导入简历</a>
      <a class="sidebar__item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg>我的简历</a>
    </nav>
    <div class="sidebar__ft"><div class="sidebar__user"><div class="sidebar__avatar">A</div><div><div class="sidebar__uname">Amor</div><div class="sidebar__badge"><em>免费版</em></div></div></div></div>
  </aside>
  <div class="main">
    <div class="empty__title">先建一份简历</div>
    <div class="empty__sub">从模板开始、导入已有文件，或者直接建空白文档。</div>
    <div class="entries">
      <div class="entry entry--primary" onclick="location.href='trae-02-templates.html'">
        <div class="entry__icon entry__icon--a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
        <div class="entry__name">模板创建</div>
        <div class="entry__desc">选一个模板，5 分钟出稿</div>
      </div>
      <div class="entry" onclick="location.href='trae-03-import.html'">
        <div class="entry__icon entry__icon--b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/></svg></div>
        <div class="entry__name">导入文件</div>
        <div class="entry__desc">Word / PDF 一键导入</div>
      </div>
      <div class="entry" onclick="location.href='trae-style.html'">
        <div class="entry__icon entry__icon--c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/><path d="M8 12h8M12 8v8"/></svg></div>
        <div class="entry__name">空白简历</div>
        <div class="entry__desc">从零开始自己排版</div>
      </div>
    </div>
    <div class="recent">
      <div class="recent__title">最近打开</div>
      <div class="recent__list">
        <div class="recent__item" onclick="location.href='trae-style.html'">
          <div class="recent__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg></div>
          <div><div class="recent__name">张明-后端开发工程师-2026届</div><div class="recent__meta">2 小时前 · 1 页 · 1,286 字</div></div>
          <div class="recent__arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg></div>
        </div>
        <div class="recent__item">
          <div class="recent__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg></div>
          <div><div class="recent__name">李华-产品经理-秋招</div><div class="recent__meta">昨天 · 2 页 · 2,104 字</div></div>
          <div class="recent__arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
