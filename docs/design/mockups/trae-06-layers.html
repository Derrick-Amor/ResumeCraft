<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>06 图层与画板 · ResumeCraft</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
:root{--bg:#f5f6f8;--white:#fff;--glass:rgba(255,255,255,.72);--blue1:#4A9EF7;--blue2:#6CB8FF;--grad:linear-gradient(135deg,#4A9EF7,#6CB8FF);--text1:#1B1F2A;--text2:#6B7280;--text3:#9CA3AF;--border:#E5E7EB;--hover:#F3F4F6;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-full:999px;--sh-md:0 2px 8px rgba(0,0,0,.06);--sh-lg:0 8px 24px rgba(0,0,0,.08);--sh-float:0 4px 16px rgba(74,158,247,.15);--ease:cubic-bezier(.25,.1,.25,1);--ease-out:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Inter","Noto Sans SC",-apple-system,sans-serif;background:var(--bg);color:var(--text1);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
svg{display:block}
.topbar{position:fixed;top:0;left:0;right:0;height:36px;background:var(--white);border-bottom:1px solid #F0F1F3;display:flex;align-items:center;padding:0 12px;z-index:100;user-select:none}
.topbar__logo{width:20px;height:20px;background:var(--grad);border-radius:5px;display:flex;align-items:center;justify-content:center;margin-right:8px;flex:none}
.topbar__sp{flex:1}
.topbar__cb{width:28px;height:28px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--text3)}
.topbar__cb:hover{background:var(--hover)}
.topbar__cb--x:hover{background:#EF4444;color:#fff}
.app{display:flex;height:100vh;padding-top:36px}
.sidebar{width:220px;background:var(--white);border-right:1px solid #F0F1F3;display:flex;flex-direction:column;padding:12px;flex:none}
.sidebar__nav{display:flex;flex-direction:column;gap:2px}
.sidebar__item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-md);color:var(--text2);font-size:13px;font-weight:500;transition:all .2s;text-decoration:none}
.sidebar__item:hover{background:var(--hover);color:var(--text1)}
.sidebar__item.active{background:rgba(74,158,247,.1);color:var(--blue1)}
.sidebar__item svg{width:18px;height:18px;flex:none;opacity:.7}
.sidebar__item.active svg{opacity:1}
.sidebar__ft{margin-top:auto;padding:12px;border-top:1px solid #F0F1F3}
.sidebar__user{display:flex;align-items:center;gap:8px}
.sidebar__avatar{width:32px;height:32px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;flex:none}
.sidebar__uname{font-size:12px;font-weight:500}
.sidebar__badge{font-size:10px;color:var(--text3)}
.sidebar__badge em{font-style:normal;background:rgba(74,158,247,.1);color:var(--blue1);padding:1px 6px;border-radius:var(--r-full);font-weight:500}
.main{flex:1;display:flex;overflow:hidden}
.layers-panel{width:280px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;flex:none}
.layers-panel__head{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.layers-panel__title{font-size:14px;font-weight:600}
.layers-panel__count{font-size:11px;color:var(--text3);background:var(--hover);padding:2px 8px;border-radius:var(--r-full)}
.layers-panel__body{flex:1;overflow-y:auto;padding:8px}
.layer-group{margin-bottom:8px}
.layer-group__head{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.layer-group__dot{width:6px;height:6px;border-radius:50%;flex:none}
.layer-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-md);cursor:pointer;transition:all .15s;position:relative}
.layer-row:hover{background:var(--hover)}
.layer-row.selected{background:rgba(74,158,247,.1)}
.layer-row.selected::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--grad);border-radius:var(--r-full)}
.layer-row__grip{opacity:0;cursor:grab;color:var(--text3);transition:opacity .15s;flex:none}
.layer-row:hover .layer-row__grip{opacity:1}
.layer-row__eye{color:var(--text3);cursor:pointer;flex:none;transition:color .15s}
.layer-row__eye:hover{color:var(--text1)}
.layer-row__lock{color:var(--text3);cursor:pointer;flex:none}
.layer-row__thumb{width:24px;height:24px;border-radius:4px;background:var(--hover);display:flex;align-items:center;justify-content:center;color:var(--text3);flex:none}
.layer-row__name{flex:1;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer-row.selected .layer-row__name{color:var(--blue1);font-weight:500}
.layer-row__type{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--hover);color:var(--text3);flex:none}
.canvas-area{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:auto;position:relative}
.canvas-area__paper{width:400px;height:566px;background:var(--white);border-radius:var(--r-md);box-shadow:var(--sh-lg);position:relative;overflow:hidden}
.canvas-area__paper-content{padding:32px}
.canvas-area__paper-content h1{font-size:18px;font-weight:700;margin-bottom:4px}
.canvas-area__paper-content .sub{font-size:10px;color:var(--text2);margin-bottom:16px}
.canvas-area__paper-content h2{font-size:11px;font-weight:600;margin:12px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--border)}
.canvas-area__paper-content .item{font-size:9px;color:var(--text2);margin:2px 0}
.canvas-area__paper-content .bar{height:3px;background:var(--border);border-radius:2px;margin:3px 0}
.canvas-area__paper-content .bar.w80{width:80%}.canvas-area__paper-content .bar.w60{width:60%}.canvas-area__paper-content .bar.w40{width:40%}
.selected-box{position:absolute;border:2px solid var(--blue1);border-radius:4px;pointer-events:none}
.selected-box__handle{position:absolute;width:8px;height:8px;background:#fff;border:1.5px solid var(--blue1);border-radius:2px}
.selected-box__handle.tl{top:-4px;left:-4px}.selected-box__handle.tr{top:-4px;right:-4px}
.selected-box__handle.bl{bottom:-4px;left:-4px}.selected-box__handle.br{bottom:-4px;right:-4px}
.canvas-toolbar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px 10px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.85);border-radius:var(--r-full);box-shadow:0 8px 32px rgba(0,0,0,.06);z-index:10}
.canvas-tool{width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.canvas-tool:hover{background:rgba(0,0,0,.05);color:var(--text1)}
.canvas-tool svg{width:16px;height:16px}
.canvas-tool-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.layers-panel{animation:fadeUp .4s var(--ease-out) both}
.canvas-area__paper{animation:fadeUp .5s var(--ease-out) .1s both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important}}
</style>
</head>
