<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naive UI 小样 · ResumeCraft</title>
    <!--
      CDN 版小样（TC-002 B 段收尾：已删除本地 vendor 快照，改为在线引用）。
        vue@3.5.44        https://unpkg.com/vue@3.5.44/dist/vue.global.prod.js
        naive-ui@2.45.3   https://unpkg.com/naive-ui@2.45.3/dist/index.prod.js
                          （全局变量 naive，样式为 CSS-in-JS，无独立 css 文件）
      ⚠ 需联网打开；离线请看同目录截图 naive.png（#dialog 状态，900×1000）。
      恢复本地快照的方案见 docs/ui-lib-compare.md §6「最终裁决」。
      审阅便利：URL 末尾加 #dialog 可直接打开确认对话框（预填演示数据）。
    -->
    <style>
      :root {
        --rc-color-primary: #2f6feb;
        --rc-color-text: #1f2329;
        --rc-color-border: #dcdfe6;
        --rc-radius: 6px;
        --rc-gap: 16px;
        --rc-bg: #f5f6f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 16px;
        background: var(--rc-bg);
        color: var(--rc-color-text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
      }
      .card {
        background: #fff;
        border: 1px solid var(--rc-color-border);
        border-radius: var(--rc-radius);
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .sub {
        margin: 0 0 20px;
        font-size: 13px;
        color: #6b7280;
      }
      .tokens {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .swatch {
        font-size: 12px;
        padding: 4px 8px;
        border: 1px solid var(--rc-color-border);
        border-radius: var(--rc-radius);
        color: #4b5563;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: var(--rc-gap);
        margin-top: 8px;
      }
      .result {
        margin-top: 16px;
        font-size: 13px;
        color: #15803d;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script src="https://unpkg.com/vue@3.5.44/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/naive-ui@2.45.3/dist/index.prod.js"></script>
    <script>
      const { createApp, h, ref, reactive } = Vue
      const {
        NConfigProvider,
        NForm,
        NFormItem,
        NInput,
        NButton,
        NSpace,
        NModal,
        NAlert,
      } = naive

      // 用 CSS 变量对齐页面 token，再把组件主色接到同一数值上（themeOverrides），
      // 观察「token 单一事实源」的接入成本。NConfigProvider 必须包住整棵树，
      // 否则 teleport 到 body 的 NModal 拿不到覆写后的主题。
      const themeOverrides = {
        common: {
          primaryColor: '#2f6feb',
          primaryColorHover: '#4b84f0',
          primaryColorPressed: '#2559c4',
          borderRadius: '6px',
          fontSize: '14px',
        },
      }

      createApp({
        setup() {
          const demo = window.location.hash === '#dialog'
          const formRef = ref(null)
          const model = reactive(
            demo
              ? { name: '张三', email: 'zhangsan@example.com', phone: '13800138000' }
              : { name: '', email: '', phone: '' },
          )
          const showConfirm = ref(demo)
          const savedText = ref('')

          const rules = {
            name: [
              { required: true, message: '请输入姓名', trigger: ['input', 'blur'] },
              { min: 2, message: '姓名至少 2 个字符', trigger: ['input', 'blur'] },
            ],
            email: [
              { required: true, message: '请输入邮箱', trigger: ['input', 'blur'] },
              {
                pattern: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
                message: '邮箱格式不正确',
                trigger: ['input', 'blur'],
              },
            ],
            phone: [
              { required: true, message: '请输入手机号', trigger: ['input', 'blur'] },
              {
                pattern: /^1[3-9]\d{9}$/,
                message: '请输入 11 位手机号',
                trigger: ['input', 'blur'],
              },
            ],
          }

          function onSubmit() {
            formRef.value?.validate((errors) => {
              if (!errors) showConfirm.value = true
            })
          }

          function onConfirm() {
            savedText.value = `已保存：${model.name} / ${model.email} / ${model.phone}`
            showConfirm.value = false
          }

          return () =>
            h(
              NConfigProvider,
              { themeOverrides },
              {
                default: () =>
                  h('div', { class: 'wrap' }, [
                    h('div', { class: 'card' }, [
                      h('h1', null, 'ResumeCraft · Naive UI 小样'),
                      h(
                        'p',
                        { class: 'sub' },
                        '同一表单、同一校验规则，用于对比组件库与设计 token 的融合成本。',
                      ),
                      h('div', { class: 'tokens' }, [
                        h('span', { class: 'swatch' }, '--rc-color-primary #2f6feb'),
                        h('span', { class: 'swatch' }, '--rc-radius 6px'),
                        h('span', { class: 'swatch' }, '--rc-gap 16px'),
                      ]),
                      h(
                        NForm,
                        {
                          ref: formRef,
                          model,
                          rules,
                          labelPlacement: 'top',
                          size: 'medium',
                        },
                        {
                          default: () => [
                            h(
                              NFormItem,
                              { label: '姓名', path: 'name' },
                              {
                                default: () =>
                                  h(NInput, {
                                    value: model.name,
                                    'onUpdate:value': (v) => (model.name = v),
                                    placeholder: '请输入真实姓名',
                                    clearable: true,
                                  }),
                              },
                            ),
                            h(
                              NFormItem,
                              { label: '邮箱', path: 'email' },
                              {
                                default: () =>
                                  h(NInput, {
                                    value: model.email,
                                    'onUpdate:value': (v) => (model.email = v),
                                    placeholder: 'name@example.com',
                                    clearable: true,
                                  }),
                              },
                            ),
                            h(
                              NFormItem,
                              { label: '手机号', path: 'phone' },
                              {
                                default: () =>
                                  h(NInput, {
                                    value: model.phone,
                                    'onUpdate:value': (v) => (model.phone = v),
                                    placeholder: '11 位手机号',
                                    maxlength: 11,
                                    clearable: true,
                                  }),
                              },
                            ),
                            h('div', { class: 'actions' }, [
                              h(
                                NButton,
                                { type: 'primary', onClick: onSubmit },
                                { default: () => '保存基本信息' },
                              ),
                              h(
                                NButton,
                                {
                                  onClick: () => {
                                    model.name = ''
                                    model.email = ''
                                    model.phone = ''
                                    formRef.value?.restoreValidation()
                                    savedText.value = ''
                                  },
                                },
                                { default: () => '重置' },
                              ),
                            ]),
                            savedText.value ? h('div', { class: 'result' }, savedText.value) : null,
                          ],
                        },
                      ),
                    ]),
                    h(
                      NModal,
                      {
                        show: showConfirm.value,
                        'onUpdate:show': (v) => (showConfirm.value = v),
                        preset: 'card',
                        title: '确认保存',
                        style: 'width: 420px',
                      },
                      {
                        default: () =>
                          h('div', null, [
                            h('p', { style: 'margin:0 0 12px' }, '确认将这些信息写入简历？'),
                            h(
                              NAlert,
                              { type: 'info', showIcon: true },
                              { default: () => '提交后仍可在编辑器中修改。' },
                            ),
                          ]),
                        footer: () =>
                          h(
                            NSpace,
                            { justify: 'end' },
                            {
                              default: () => [
                                h(
                                  NButton,
                                  { onClick: () => (showConfirm.value = false) },
                                  { default: () => '取消' },
                                ),
                                h(
                                  NButton,
                                  { type: 'primary', onClick: onConfirm },
                                  { default: () => '确认保存' },
                                ),
                              ],
                            },
                          ),
                      },
                    ),
                  ]),
              },
            )
        },
      }).mount('#app')
    </script>
  </body>
</html>
