<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Element Plus 小样 · ResumeCraft</title>
    <!--
      离线可打开的小样：使用官方发行包里的 UMD 快照（未安装进主工程）。
        vue@3.5.44            dist/vue.global.prod.js
        element-plus@2.14.7   dist/index.full.min.js   全局变量 ElementPlus
        element-plus@2.14.7   dist/index.css
      若改用 CDN，对应地址：
        https://unpkg.com/vue@3.5.44/dist/vue.global.prod.js
        https://unpkg.com/element-plus@2.14.7/dist/index.full.min.js
        https://unpkg.com/element-plus@2.14.7/dist/index.css
    -->
    <link rel="stylesheet" href="./vendor/element-plus-2.14.7.index.css" />
    <style>
      /* Element Plus 的 token 就是 CSS 变量，直接在 :root 覆写即可与设计 token 对齐 */
      :root {
        --el-color-primary: #2f6feb;
        --el-color-primary-light-3: #4b84f0;
        --el-color-primary-dark-2: #2559c4;
        --el-border-radius-base: 6px;

        --rc-color-primary: #2f6feb;
        --rc-color-text: #1f2329;
        --rc-color-border: #dcdfe6;
        --rc-radius: 6px;
        --rc-gap: 16px;
        --rc-bg: #f5f6f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 16px;
        background: var(--rc-bg);
        color: var(--rc-color-text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
      }
      .card {
        background: #fff;
        border: 1px solid var(--rc-color-border);
        border-radius: var(--rc-radius);
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .sub {
        margin: 0 0 20px;
        font-size: 13px;
        color: #6b7280;
      }
      .tokens {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .swatch {
        font-size: 12px;
        padding: 4px 8px;
        border: 1px solid var(--rc-color-border);
        border-radius: var(--rc-radius);
        color: #4b5563;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: var(--rc-gap);
        margin-top: 8px;
      }
      .result {
        margin-top: 16px;
        font-size: 13px;
        color: #15803d;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script src="./vendor/vue-3.5.44.global.prod.js"></script>
    <script src="./vendor/element-plus-2.14.7.full.min.js"></script>
    <script>
      const { createApp, h, ref, reactive } = Vue
      const { ElForm, ElFormItem, ElInput, ElButton, ElDialog, ElAlert } = ElementPlus

      createApp({
        setup() {
          // 审阅便利：URL 末尾加 #dialog 时预填数据并直接打开确认对话框，默认交互不受影响
          const demo = window.location.hash === '#dialog'
          const formRef = ref(null)
          const model = reactive(
            demo
              ? { name: '张三', email: 'zhangsan@example.com', phone: '13800138000' }
              : { name: '', email: '', phone: '' },
          )
          const showConfirm = ref(demo)
          const savedText = ref('')

          const rules = {
            name: [
              { required: true, message: '请输入姓名', trigger: ['blur', 'change'] },
              { min: 2, message: '姓名至少 2 个字符', trigger: ['blur', 'change'] },
            ],
            email: [
              { required: true, message: '请输入邮箱', trigger: ['blur', 'change'] },
              { type: 'email', message: '邮箱格式不正确', trigger: ['blur', 'change'] },
            ],
            phone: [
              { required: true, message: '请输入手机号', trigger: ['blur', 'change'] },
              {
                pattern: /^1[3-9]\d{9}$/,
                message: '请输入 11 位手机号',
                trigger: ['blur', 'change'],
              },
            ],
          }

          function onSubmit() {
            formRef.value
              ?.validate()
              .then(() => {
                showConfirm.value = true
              })
              .catch(() => {
                /* 校验失败时由表单项自身提示，不额外处理 */
              })
          }

          function onConfirm() {
            savedText.value = `已保存：${model.name} / ${model.email} / ${model.phone}`
            showConfirm.value = false
          }

          return () =>
            h('div', { class: 'wrap' }, [
              h('div', { class: 'card' }, [
                h('h1', null, 'ResumeCraft · Element Plus 小样'),
                h('p', { class: 'sub' }, '同一表单、同一校验规则，用于对比组件库与设计 token 的融合成本。'),
                h('div', { class: 'tokens' }, [
                  h('span', { class: 'swatch' }, '--rc-color-primary #2f6feb'),
                  h('span', { class: 'swatch' }, '--rc-radius 6px'),
                  h('span', { class: 'swatch' }, '--rc-gap 16px'),
                ]),
                h(
                  ElForm,
                  {
                    ref: formRef,
                    model,
                    rules,
                    labelPosition: 'top',
                    size: 'default',
                  },
                  {
                    default: () => [
                      h(
                        ElFormItem,
                        { label: '姓名', prop: 'name' },
                        {
                          default: () =>
                            h(ElInput, {
                              modelValue: model.name,
                              'onUpdate:modelValue': (v) => (model.name = v),
                              placeholder: '请输入真实姓名',
                              clearable: true,
                            }),
                        },
                      ),
                      h(
                        ElFormItem,
                        { label: '邮箱', prop: 'email' },
                        {
                          default: () =>
                            h(ElInput, {
                              modelValue: model.email,
                              'onUpdate:modelValue': (v) => (model.email = v),
                              placeholder: 'name@example.com',
                              clearable: true,
                            }),
                        },
                      ),
                      h(
                        ElFormItem,
                        { label: '手机号', prop: 'phone' },
                        {
                          default: () =>
                            h(ElInput, {
                              modelValue: model.phone,
                              'onUpdate:modelValue': (v) => (model.phone = v),
                              placeholder: '11 位手机号',
                              maxlength: 11,
                              clearable: true,
                            }),
                        },
                      ),
                      h('div', { class: 'actions' }, [
                        h(
                          ElButton,
                          { type: 'primary', onClick: onSubmit },
                          { default: () => '保存基本信息' },
                        ),
                        h(
                          ElButton,
                          {
                            onClick: () => {
                              model.name = ''
                              model.email = ''
                              model.phone = ''
                              formRef.value?.clearValidate()
                            },
                          },
                          { default: () => '重置' },
                        ),
                      ]),
                      savedText.value ? h('div', { class: 'result' }, savedText.value) : null,
                    ],
                  },
                ),
              ]),
              h(
                ElDialog,
                {
                  modelValue: showConfirm.value,
                  'onUpdate:modelValue': (v) => (showConfirm.value = v),
                  title: '确认保存',
                  width: '420px',
                },
                {
                  default: () =>
                    h('div', null, [
                      h('p', { style: 'margin:0 0 12px' }, '确认将这些信息写入简历？'),
                      h(
                        ElAlert,
                        {
                          title: '提交后仍可在编辑器中修改。',
                          type: 'info',
                          showIcon: true,
                          closable: false,
                        },
                        {},
                      ),
                    ]),
                  footer: () =>
                    h('div', { style: 'display:flex;justify-content:flex-end;gap:8px' }, [
                      h(
                        ElButton,
                        { onClick: () => (showConfirm.value = false) },
                        { default: () => '取消' },
                      ),
                      h(
                        ElButton,
                        { type: 'primary', onClick: onConfirm },
                        { default: () => '确认保存' },
                      ),
                    ]),
                },
              ),
            ])
        },
      }).mount('#app')
    </script>
  </body>
</html>
